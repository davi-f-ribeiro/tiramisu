                        <div class="form-section-title">Subtitle Provider</div>

                        <div class="form-group">
                            <div class="toggle-row">
                                <label>Enabled</label>
                                <div class="toggle-switch">
                                    <input type="checkbox" id="subtitle_enabled"
                                        form="tiramisu-form">
                                    <span class="slider"></span>
                                </div>
                            </div>
                            <div class="hint">Enable subtitle provider (SubDB + OpenSubtitles)</div>
                        </div>

                        <div class="form-section" id="subtitle-advanced-section" style="margin-top: 12px; display: none;">
                            <div class="form-group">
                                <label>OpenSubtitles API Key</label>
                                <input type="password" id="subtitle_api_key"
                                    form="tiramisu-form"
                                    placeholder="Enter your OpenSubtitles REST API key">
                                <div class="hint">Required when enabled. Get from https://opensubtitles.org</div>
                            </div>

                            <div class="form-group">
                                <label>Base URL</label>
                                <input type="text" id="subtitle_base_url"
                                    form="tiramisu-form"
                                    placeholder="https://api.opensubtitles.com">
                                <div class="hint">Custom endpoint (leave default for OpenSubtitles.org)</div>
                            </div>

                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" id="subtitle_user"
                                    form="tiramisu-form"
                                    placeholder="Your OpenSubtitles username">
                            </div>

                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" id="subtitle_password"
                                    form="tiramisu-form"
                                    placeholder="Your OpenSubtitles password">
                            </div>

                            <div class="form-group">
                                <label>Preferred Languages</label>
                                <input type="text" id="subtitle_preferred_languages"
                                    form="tiramisu-form"
                                    placeholder="por, multi, eng"
                                    value="por, multi, eng">
                                <div class="hint">Comma-separated language codes (ISO 639-2/B)</div>
                            </div>

                            <div class="form-group">
                                <label>Max Results Per Provider</label>
                                <input type="number" id="subtitle_max_results"
                                    form="tiramisu-form"
                                    min="1" max="50" value="5">
                                <div class="hint">How many results to request from each provider</div>
                            </div>
                        </div>

                        <button type="button" class="btn btn-primary" onclick="saveSubtitle()"
                            style="margin-top: 12px;">Apply Subtitle Settings</button>
                        <div id="subtitle-save-status" class="status-msg"></div>
